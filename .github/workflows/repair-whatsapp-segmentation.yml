name: Repair WhatsApp segmentation

on:
  push:
    paths:
      - 'smart_brain.py'
      - '.github/workflows/repair-whatsapp-segmentation.yml'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Repair WhatsApp segmentation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch OCR cleanup and customer segmentation
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('smart_brain.py')
          s = p.read_text(encoding='utf-8')

          start = s.index('def _ocr_image(')
          end = s.index('\ndef _looks_like_product', start)
          new_ocr = r'''def _is_whatsapp_ui_line(line: str) -> bool:
    t = re.sub(r"\s+", " ", str(line)).strip().lower()
    if not t:
        return True
    if t in {"- forwarded", "forwarded", "-forwarded", "self pick", "tomorrow", "today", "yesterday"}:
        return True
    if re.fullmatch(r"[-–—]?\s*forwarded", t):
        return True
    if re.fullmatch(r"\d{1,2}:\d{2}\s*(?:am|pm)?\s*[a-z0-9._-]*", t):
        return True
    if re.fullmatch(r"\d{1,2}:\d{2}\s*(?:am|pm)?\s*[-–—]?\s*(?:v|y|m)?", t):
        return True
    if re.fullmatch(r"[-–—]?\s*\d{1,2}:\d{2}\s*(?:am|pm)?\s*[-–—]?\s*(?:v|y|m)?", t):
        return True
    if t.startswith("--- ocr pass"):
        return True
    return False


def _ocr_image(image_bytes: bytes) -> str:
    try:
        image = Image.open(io.BytesIO(image_bytes)).convert("RGB")
        gray = ImageOps.grayscale(image)
        gray = ImageOps.autocontrast(gray)
        if max(gray.size) < 3200:
            scale = 3200 / max(gray.size)
            gray = gray.resize((int(gray.size[0] * scale), int(gray.size[1] * scale)), Image.Resampling.LANCZOS)
        gray = gray.filter(ImageFilter.SHARPEN)

        raw_passes = []
        for psm in (6, 11):
            text = pytesseract.image_to_string(gray, config=f"--psm {psm}")
            if text:
                raw_passes.append(text)

        # Merge OCR passes while removing obvious WhatsApp UI and exact duplicate lines.
        seen = set()
        cleaned = []
        for raw in raw_passes:
            for raw_line in raw.splitlines():
                line = re.sub(r"\s+", " ", raw_line).strip()
                if not line or _is_whatsapp_ui_line(line):
                    continue
                key = re.sub(r"[^a-z0-9/]+", "", line.lower())
                if not key or key in seen:
                    continue
                seen.add(key)
                cleaned.append(line)
        return "\n".join(cleaned)
    except Exception:
        return ""

'''
          s = s[:start] + new_ocr + s[end:]

          start = s.index('def _is_probable_customer_heading(')
          end = s.index('\ndef _call_groq_text', start)
          new_seg = r'''def _is_probable_customer_heading(line: str) -> bool:
    t = re.sub(r"\s+", " ", str(line)).strip()
    if not t or _is_whatsapp_ui_line(t) or _looks_like_product(t):
        return False
    if re.search(r"\b(?:ctn|carton|cartons|box|boxes|pkt|packet|packets|pcs|pc|kg|blk|block)\b", t, re.I):
        return False
    if re.search(r"\d", t):
        return False
    if len(t.split()) > 10:
        return False
    return True


def _segment_customer_blocks(ocr: str) -> str:
    """Create hard customer blocks. A heading is accepted only when a product appears shortly after it."""
    if not ocr.strip():
        return ""

    lines = []
    for raw in ocr.splitlines():
        line = re.sub(r"\s+", " ", raw).strip()
        if not line or _is_whatsapp_ui_line(line):
            continue
        lines.append(line)

    def next_product_exists(idx: int, lookahead: int = 7) -> bool:
        for j in range(idx + 1, min(len(lines), idx + 1 + lookahead)):
            candidate = lines[j]
            if _looks_like_product(candidate):
                return True
        return False

    blocks = []
    current_name = None
    current_lines = []

    for i, line in enumerate(lines):
        candidate_heading = _is_probable_customer_heading(line) and next_product_exists(i)
        if candidate_heading:
            if current_name is not None and current_lines:
                blocks.append((current_name, current_lines))
            current_name = line
            current_lines = []
            continue
        if current_name is not None:
            current_lines.append(line)

    if current_name is not None and current_lines:
        blocks.append((current_name, current_lines))

    if not blocks:
        return ""

    parts = []
    for idx, (name, block_lines) in enumerate(blocks, 1):
        # Drop trailing pure chatter and keep product-bearing lines.
        useful = [x for x in block_lines if _looks_like_product(x)]
        if not useful:
            continue
        parts.append(
            f"=== CUSTOMER BLOCK {idx} ===\nCUSTOMER: {name}\n" + "\n".join(useful)
        )
    return "\n\n".join(parts)

'''
          s = s[:start] + new_seg + s[end:]

          # Ensure the vision prompt receives cleaned blocks, not duplicated OCR passes.
          s = s.replace('segmented = _segment_customer_blocks(ocr_raw)\n', 'segmented = _segment_customer_blocks(ocr_raw)\n')
          p.write_text(s, encoding='utf-8')

      - name: Validate Python
        run: python -m py_compile smart_brain.py

      - name: Commit repair and remove this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart_brain.py
          git commit -m 'Repair WhatsApp segmentation' || true
          git push
          git rm .github/workflows/repair-whatsapp-segmentation.yml
          git commit -m 'Remove temporary WhatsApp segmentation repair workflow'
          git push
