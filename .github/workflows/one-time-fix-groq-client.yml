name: One-time fix Groq image client

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-groq-client.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Add one-time fix for Groq image client' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert missing Groq client and validate
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          p = Path('smart_brain.py')
          s = p.read_text(encoding='utf-8')
          old = '''def _call_groq_image(image_bytes: bytes, mime: str = "image/png") -> Dict[str, Any]:\n    key = _secret("GROQ_API_KEY")\n'''
          new = '''def _call_groq_image(image_bytes: bytes, mime: str = "image/png") -> Dict[str, Any]:\n    key = _secret("GROQ_API_KEY")\n    client = OpenAI(api_key=key, base_url="https://api.groq.com/openai/v1")\n'''
          if old not in s:
              raise SystemExit('Target function signature not found; refusing to modify file')
          if '    client = OpenAI(api_key=key, base_url="https://api.groq.com/openai/v1")\n    if not key:' in s:
              pass
          else:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          subprocess.run(['python','-m','py_compile','smart_brain.py','ai_order_parser.py','app.py'], check=True)

      - name: Commit fix and remove this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart_brain.py
          git commit -m 'Fix Groq image client initialization'
          git rm .github/workflows/one-time-fix-groq-client.yml
          git commit -m 'Remove one-time repair workflow'
          git push
