name: Repair WhatsApp Focus
on:
  push:
    paths:
      - smart_brain.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'WhatsApp parser focus repair') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch smart_brain
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('smart_brain.py')
          s=p.read_text(encoding='utf-8')
          marker='def _looks_like_product(line: str) -> bool:\n'
          helpers='''NOISE_PATTERNS = [\n    r"^\\s*-?\\s*forwarded\\s*$",\n    r"^\\s*self\\s*pick\\s*$",\n    r"^\\s*(?:today|tomorrow|yesterday|later|thanks|thank you|ok|okay|salam|hello|hi)\\s*$",\n    r"^\\s*\\d{1,2}:\\d{2}(?:\\s*(?:am|pm))?.*$",\n    r"^\\s*\\d{1,2}[-/]\\d{1,2}[-/]\\d{2,4}\\s*$",\n    r"^\\s*---+\\s*(?:ocr pass|ocr)\\s*---+\\s*$",\n]\n\ndef _is_noise_line(line: str) -> bool:\n    t=re.sub(r"\\s+"," ",str(line)).strip()\n    if not t:\n        return True\n    return any(re.search(p,t,re.I) for p in NOISE_PATTERNS)\n\n\n'''
          if 'def _is_noise_line(line: str)' not in s and marker in s:
              s=s.replace(marker,helpers+marker)
          start=s.index('def _is_probable_customer_heading(')
          end=s.index('\ndef _segment_customer_blocks',start)
          repl='''def _is_probable_customer_heading(line: str) -> bool:\n    t=re.sub(r"\\s+"," ",str(line)).strip()\n    if _is_noise_line(t) or not t or _looks_like_product(t):\n        return False\n    if re.search(r"\\b(?:ctn|carton|cartons|box|boxes|pkt|packet|packets|pcs|pc|kg|blk|block)\\b",t,re.I):\n        return False\n    if re.search(r"\\d",t):\n        return False\n    if len(t.split())>10:\n        return False\n    return True\n'''
          s=s[:start]+repl+s[end:]
          start=s.index('def _segment_customer_blocks(')
          end=s.index('\ndef _call_groq_text',start)
          repl='''def _segment_customer_blocks(ocr: str) -> str:\n    if not ocr.strip():\n        return ""\n    raw=[re.sub(r"\\s+"," ",x).strip() for x in ocr.splitlines()]\n    lines=[]\n    seen=set()\n    for line in raw:\n        if _is_noise_line(line):\n            continue\n        key=line.casefold()\n        if key in seen:\n            continue\n        seen.add(key)\n        lines.append(line)\n    candidates=[]\n    for i,line in enumerate(lines):\n        if not _is_probable_customer_heading(line):\n            continue\n        j=i+1\n        product_seen=False\n        while j<len(lines) and j<i+8:\n            if _looks_like_product(lines[j]):\n                product_seen=True\n                break\n            if _is_probable_customer_heading(lines[j]):\n                break\n            j+=1\n        if product_seen:\n            candidates.append((i,line))\n    if not candidates:\n        return "\\n".join(lines)\n    parts=[]\n    for idx,(pos,name) in enumerate(candidates,1):\n        stop=candidates[idx][0] if idx<len(candidates) else len(lines)\n        block=[x for x in lines[pos+1:stop] if _looks_like_product(x)]\n        if block:\n            parts.append(f"=== CUSTOMER BLOCK {idx} ===\\nCUSTOMER: {name}\\n"+"\\n".join(block))\n    return "\\n\\n".join(parts)\n'''
          s=s[:start]+repl+s[end:]
          old='''            product = str(item.get("product", "")).strip()\n            if not product:\n                continue\n'''
          new='''            product = str(item.get("product", "")).strip()\n            if not product or _is_noise_line(product):\n                continue\n            if not _looks_like_product(product):\n                continue\n'''
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate and commit
        shell: bash
        run: |
          python -m py_compile smart_brain.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart_brain.py
          git commit -m "WhatsApp parser focus repair"
          git rm .github/workflows/repair-whatsapp-focus.yml
          git commit -m "Remove temporary WhatsApp focus repair workflow"
          git push
