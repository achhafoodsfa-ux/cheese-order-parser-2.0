name: Unify AI Into Main Parser

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Unify AI into main parser') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch main parser
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')

          # One parser: AI is always the first understanding layer; ai_order_parser.py already falls back on API failures.
          text = re.sub(r'\n\s*ai_enabled = st\.checkbox\("🧠 Use AI Smart Parsing \(recommended\)".*?\n', '\n', text, count=1)

          old_img = '''                if ai_enabled:\n                    ai_result = ai_parse_order_image(data)\n                    extracted = ai_to_parser_text(ai_result)\n                    st.caption("🧠 AI interpretation used; FG mapping remains local/authoritative.")\n                else:\n                    extracted = ocr_image(data)'''
          new_img = '''                ai_result = ai_parse_order_image(data)\n                extracted = ai_to_parser_text(ai_result)\n                st.caption("🧠 AI assists understanding; your local product master/rules remain authoritative for FG mapping.")'''
          if old_img not in text: raise SystemExit('pasted image block not found')
          text = text.replace(old_img, new_img, 1)

          old_txt = '''            if ai_enabled:\n                ai_result = ai_parse_order_text(message)\n                parser_text = ai_to_parser_text(ai_result)\n                st.caption("🧠 AI interpretation used; customer codes are ignored for product mapping.")\n                with st.expander("🔎 AI interpretation", expanded=False):\n                    st.json(ai_result)\n            else:\n                ai_result = {"customer_name": "", "items": []}\n                parser_text = message'''
          new_txt = '''            ai_result = ai_parse_order_text(message)\n            parser_text = ai_to_parser_text(ai_result)\n            st.caption("🧠 AI assists understanding; customer codes are ignored for product mapping.")\n            with st.expander("🔎 AI interpretation", expanded=False):\n                st.json(ai_result)'''
          if old_txt not in text: raise SystemExit('text AI block not found')
          text = text.replace(old_txt, new_txt, 1)
          text = text.replace('if ai_enabled and ai_result.get("customer_name"):', 'if ai_result.get("customer_name"):', 2)

          old_file = '''                else:\n                    extracted=str(content)\n                    with st.expander("🔎 Extracted text / OCR",expanded=False):st.text(extracted[:12000] if extracted else "[No text detected]")\n                    if extracted.strip():\n                        status.info("Step 3/4 — Parsing extracted order…");customer,rows=parse_order(extracted,lambda v,t: progress.progress(min(0.65+v*0.25,0.90),text=t));show_order_result(customer,rows,f.name)\n                    else:st.error(f"{f.name}: no readable text was detected.")'''
          new_file = '''                else:\n                    ext = Path(f.name).suffix.lower()\n                    if ext in IMAGE_EXTS:\n                        ai_result = ai_parse_order_image(f.getvalue())\n                        extracted = ai_to_parser_text(ai_result)\n                        customer_name = ai_result.get("customer_name", "")\n                    else:\n                        extracted = str(content)\n                        ai_result = ai_parse_order_text(extracted)\n                        extracted = ai_to_parser_text(ai_result)\n                        customer_name = ai_result.get("customer_name", "")\n                    with st.expander("🔎 AI interpretation",expanded=False):st.json(ai_result)\n                    if extracted.strip():\n                        status.info("Step 3/4 — Mapping products and quantities…")\n                        customer,rows=parse_order(extracted,lambda v,t: progress.progress(min(0.65+v*0.25,0.90),text=t))\n                        customer = customer_name or customer\n                        show_order_result(customer,rows,f.name)\n                    else:st.error(f"{f.name}: no readable order was detected.")'''
          if old_file not in text: raise SystemExit('uploaded file block not found')
          text = text.replace(old_file, new_file, 1)

          # Box/boxes = CTN in the local parser too.
          old_q = 'm=re.search(r"(\\d+(?:\\.\\d+)?)\\s*(ctn|carton|cartons|pkt|packet|packets|pcs|pc|units?|kg)?\\b",t)'
          new_q = 'm=re.search(r"(\\d+(?:\\.\\d+)?)\\s*(ctn|carton|cartons|box|boxes|pkt|packet|packets|pcs|pc|units?|kg)?\\b",t)'
          if old_q in text: text = text.replace(old_q, new_q, 1)
          old_u = 'if unit in ("ctn","carton","cartons"):return qty,"CTN"'
          new_u = 'if unit in ("ctn","carton","cartons","box","boxes"):return qty,"CTN"'
          if old_u in text: text = text.replace(old_u, new_u, 1)

          app.write_text(text, encoding='utf-8')

          page = Path('pages/🧠 AI Smart Parser.py')
          if page.exists(): page.unlink()

          # This temporary workflow removes itself after the patch commit.
          wf = Path('.github/workflows/unify-ai-parser.yml')
          # Keep the file until after validation; the shell step removes it before pushing.

      - name: Validate
        run: |
          python -m py_compile app.py ai_order_parser.py
          grep -q 'ai_parse_order_text' app.py
          grep -q 'ai_parse_order_image' app.py
          grep -q 'box|boxes' app.py
          test ! -e 'pages/🧠 AI Smart Parser.py'

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py requirements.txt pages
          git commit -m "Unify AI into main parser"
          git rm .github/workflows/unify-ai-parser.yml
          git commit -m "Remove temporary parser patch workflow"
          git push
