name: Repair image parsing fallback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Repair image parsing fallback') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch image fallback and validate
        shell: python
        run: |
          from pathlib import Path

          p = Path('smart_brain.py')
          s = p.read_text(encoding='utf-8')

          old = '''def parse_orders_image(image_bytes: bytes, mime: str = "image/png") -> Dict[str, Any]:\n    return _run(lambda: _call_groq_image(image_bytes, mime), lambda: _call_openai_image(image_bytes, mime), "")\n'''

          new = '''def parse_orders_image(image_bytes: bytes, mime: str = "image/png") -> Dict[str, Any]:\n    """Parse an image with vision first, then fall back to OCR + text parsing if vision returns no orders."""\n    primary_result = _run(\n        lambda: _call_groq_image(image_bytes, mime),\n        lambda: _call_openai_image(image_bytes, mime),\n        "",\n    )\n    if primary_result.get("orders"):\n        return primary_result\n\n    try:\n        prepared, _ = _prepare_image(image_bytes)\n        ocr_raw = _ocr_image(prepared)\n        segmented = _segment_customer_blocks(ocr_raw)\n        if segmented.strip():\n            fallback_result = parse_orders_text(segmented)\n            if fallback_result.get("orders"):\n                return fallback_result\n        return {\n            "orders": [],\n            "_fallback": True,\n            "_fallback_text": ocr_raw,\n            "_fallback_reason": primary_result.get("_fallback_reason", "vision_returned_no_orders"),\n        }\n    except Exception as exc:\n        return {\n            "orders": [],\n            "_fallback": True,\n            "_fallback_text": "",\n            "_fallback_reason": f"ocr_fallback_failed:{type(exc).__name__}",\n        }\n'''

          if old not in s:
              raise SystemExit('Target parse_orders_image function not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          for name in ('app.py', 'ai_order_parser.py', 'smart_brain.py'):
              compile(Path(name).read_text(encoding='utf-8'), name, 'exec')

      - name: Commit repair and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart_brain.py
          git diff --cached --quiet && exit 0
          git commit -m "Repair image parsing fallback"
          git rm .github/workflows/repair-image-fallback.yml
          git commit -m "Remove one-time image fallback workflow"
          git push
