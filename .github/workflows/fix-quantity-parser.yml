name: Fix Quantity Parser

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix quantity parser') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch parse_quantity
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')

          start = text.index('def parse_quantity(line):')
          end = text.index('\ndef parse_order(text, progress=None):', start)

          new_func = '''def parse_quantity(line):
    """Extract the ordered quantity without mistaking product ratios/weights for quantity.

    Priority: explicit quantity immediately followed by an order unit (CTN/box/PKT/KG/PCS),
    then known weight expressions, then a conservative fallback. Product ratios such as 70/30
    and 50/50 are never treated as the order quantity.
    """
    t = norm(line)

    # 1) Explicit quantity + order unit anywhere in the line. This must win over numbers
    #    inside product names such as 70/30, 50/50, 2kg, 1kg, etc.
    unit_pattern = r"(ctn|carton|cartons|box|boxes|pkt|packet|packets|pcs|pc|units?|kg)"
    explicit = list(re.finditer(r"(?<![\\d/])(\\d+(?:\\.\\d+)?)\\s*" + unit_pattern + r"\\b", t))
    if explicit:
        # Prefer CTN/box/carton first when multiple quantities exist in a product description.
        for m in explicit:
            qty = float(m.group(1))
            unit = m.group(2).lower()
            if unit in ("ctn", "carton", "cartons", "box", "boxes"):
                return (int(qty) if qty.is_integer() else qty), "CTN"
        m = explicit[0]
        qty = float(m.group(1))
        unit = m.group(2).lower()
        if unit in ("pkt", "packet", "packets", "pcs", "pc", "unit", "units"):
            return (int(qty) if qty.is_integer() else qty), "PKT"
        if unit == "kg":
            return (int(qty) if qty.is_integer() else qty), "KG"

    # 2) Special 1kg/800gm burger-slice order wording already used by the parser.
    m = re.search(r"(\\d+(?:\\.\\d+)?)\\s*kg\\s+.*burger\\s*(?:/|or)?\\s*(?:orange)?\\s*slice", t)
    if m:
        qty = float(m.group(1))
        return (int(qty) if qty.is_integer() else qty), "PKT"

    # 3) Fallback: standalone number, but explicitly ignore ratio tokens like 70/30 and 50/50.
    cleaned = re.sub(r"\\b\\d+(?:\\.\\d+)?\\s*/\\s*\\d+(?:\\.\\d+)?\\b", " ", t)
    numbers = re.findall(r"(?<![\\d/])(\\d+(?:\\.\\d+)?)(?![\\d/])", cleaned)
    if not numbers:
        return None, None

    qty = float(numbers[-1])
    qty = int(qty) if qty.is_integer() else qty
    return (qty, "CTN" if qty > 10 else "PKT")
'''

          text = text[:start] + new_func + text[end:]
          app.write_text(text, encoding='utf-8')

          # Keep the AI instructions aligned with the same rule.
          ai = Path('ai_order_parser.py')
          if ai.exists():
              a = ai.read_text(encoding='utf-8')
              needle = '- Preserve quantities and units exactly when clearly stated.'
              if needle in a and 'Product ratios such as 70/30 and 50/50 are not quantities' not in a:
                  a = a.replace(needle, needle + ' Product ratios such as 70/30 and 50/50 are never order quantities; when a line contains an explicit quantity + CTN/box/carton/PKT/KG/PCS, use that quantity.')
                  ai.write_text(a, encoding='utf-8')

      - name: Validate
        run: |
          python -m py_compile app.py ai_order_parser.py
          grep -q 'Product ratios such as 70/30 and 50/50 are never order quantities' ai_order_parser.py
          grep -q 'def parse_quantity(line):' app.py

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py ai_order_parser.py
          git commit -m "Fix quantity parser"
          git rm .github/workflows/fix-quantity-parser.yml
          git commit -m "Remove temporary quantity patch workflow"
          git push
