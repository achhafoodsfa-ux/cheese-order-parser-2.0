name: Fix Box Unit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch box as CTN
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.py')
          text = app.read_text(encoding='utf-8')
          old = 'm=re.search(r"(\\d+(?:\\.\\d+)?)\\s*(ctn|carton|cartons|pkt|packet|packets|pcs|pc|units?|kg)?\\b",t)'
          new = 'm=re.search(r"(\\d+(?:\\.\\d+)?)\\s*(ctn|carton|cartons|box|boxes|pkt|packet|packets|pcs|pc|units?|kg)?\\b",t)'
          if old in text:
              text = text.replace(old, new, 1)
          old2 = 'if unit in ("ctn","carton","cartons"):return qty,"CTN"'
          new2 = 'if unit in ("ctn","carton","cartons","box","boxes"):return qty,"CTN"'
          if old2 in text:
              text = text.replace(old2, new2, 1)
          app.write_text(text, encoding='utf-8')

          ai = Path('ai_order_parser.py')
          t = ai.read_text(encoding='utf-8')
          t = t.replace('CTN/carton/cartons = CTN;', 'CTN/carton/cartons/box/boxes = CTN;')
          ai.write_text(t, encoding='utf-8')

      - name: Validate
        run: |
          grep -q 'box|boxes' app.py
          grep -q 'box/boxes' ai_order_parser.py
          python -m py_compile app.py ai_order_parser.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py ai_order_parser.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Treat box as carton CTN"
          git push
